name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml aiohttp pytest ruff
      - run: ruff check artbridge tests
      - run: pytest -q
      - run: python -m artbridge check -c artbridge/example-config.yaml
      - run: bash -n deploy/install.sh deploy/proxmox-create-lxc.sh

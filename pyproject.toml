[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "artbridge"
version = "0.2.0"
description = "Art-Net / sACN subnet bridge: lets a console reach nodes on another subnet"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=5.3", "aiohttp>=3.8"]

[project.scripts]
artbridge = "artbridge.cli:main"

[project.urls]
Homepage = "https://github.com/danieltrillo/artnet-bridge"

[tool.setuptools.packages.find]
include = ["artbridge*"]

[tool.setuptools.package-data]
artbridge = ["example-config.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
exclude = ["build", "dist"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
